name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  # Real interactive Claude Code sessions that send no prompt and no request to Anthropic
  # (test/live/live.test.ts). The version is the one docs/verification/claude-code.md records;
  # raise both together.
  live:
    name: live, no tokens (Claude Code 2.1.325)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y expect
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: npm ci
      - run: npm run test:live
